name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests (DSP + app)
        run: ./gradlew --stacktrace :dsp:test :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets configured; the release APK will be unsigned."
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease

      - name: Check APKs contain no non-arm64 native code
        run: |
          status=0
          for apk in app/build/outputs/apk/*/*.apk; do
            other=$(unzip -Z1 "$apk" | grep '^lib/' | grep -v '^lib/arm64-v8a/' || true)
            if [ -n "$other" ]; then
              echo "::error::$apk contains native code for other ABIs:"; echo "$other"; status=1
            else
              echo "$apk: OK (native libs: $(unzip -Z1 "$apk" | grep -c '^lib/arm64-v8a/' || true) arm64-v8a)"
            fi
          done
          exit $status

      - name: Test and lint summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          tests = failures = skipped = 0
          for f in glob.glob("*/build/test-results/**/*.xml", recursive=True):
              s = ET.parse(f).getroot()
              tests += int(s.get("tests", 0)); skipped += int(s.get("skipped", 0))
              failures += int(s.get("failures", 0)) + int(s.get("errors", 0))
          lint = {}
          for f in glob.glob("app/build/reports/lint-results-*.xml"):
              for issue in ET.parse(f).getroot().iter("issue"):
                  key = issue.get("severity")
                  lint[key] = lint.get(key, 0) + 1
                  loc = issue.find("location")
                  where = f"file={os.path.relpath(loc.get('file'))},line={loc.get('line', 1)}," if loc is not None else ""
                  print(f"::warning {where}title=Lint {issue.get('id')}::{issue.get('message')}")
          line = f"Unit tests: {tests} run, {failures} failed, {skipped} skipped. Lint: " + (", ".join(f"{v} {k.lower()}" for k, v in sorted(lint.items())) or "no issues")
          print(f"::notice title=Summary::{line}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### {line}\n")
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: |
            dsp/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PA-Analyzer-${GITHUB_REF_NAME}-arm64.apk"
          gh release create "$GITHUB_REF_NAME" "PA-Analyzer-${GITHUB_REF_NAME}-arm64.apk" --generate-notes
