name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v5

      # Unit tests for :dsp and :app. The app tests include the screenshot tests,
      # which render the screens into docs/screenshots.
      - name: Unit tests and screenshots
        run: ./gradlew --console=plain :dsp:test :app:testDebugUnitTest 2>&1 | tee -a gradle.log

      - name: Lint
        run: ./gradlew --console=plain :app:lintRelease 2>&1 | tee -a gradle.log

      - name: Test and lint summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, os, xml.etree.ElementTree as ET
          tests = failures = skipped = 0
          for f in glob.glob("*/build/test-results/**/*.xml", recursive=True):
              s = ET.parse(f).getroot()
              tests += int(s.get("tests", 0)); skipped += int(s.get("skipped", 0))
              failures += int(s.get("failures", 0)) + int(s.get("errors", 0))
              for case in s.iter("testcase"):
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      msg = (problem.get("message") or problem.text or "").strip().splitlines()[0][:500]
                      print(f"::error title=Test {case.get('classname')}.{case.get('name')}::{msg}")
          lint = {}
          for f in glob.glob("app/build/reports/lint-results-*.xml"):
              for issue in ET.parse(f).getroot().iter("issue"):
                  key = issue.get("severity")
                  lint[key] = lint.get(key, 0) + 1
                  loc = issue.find("location")
                  where = f"file={os.path.relpath(loc.get('file'))},line={loc.get('line', 1)}," if loc is not None else ""
                  print(f"::warning {where}title=Lint {issue.get('id')}::{issue.get('message')}")
          line = f"Unit tests: {tests} run, {failures} failed, {skipped} skipped. Lint: " + (", ".join(f"{v} {k.lower()}" for k, v in sorted(lint.items())) or "no issues")
          print(f"::notice title=Summary::{line}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write(f"### {line}\n")
          EOF

      - name: Report Gradle errors
        if: failure()
        run: .github/scripts/report-gradle-errors.sh gradle.log

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reports
          path: |
            dsp/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore

      - name: Commit updated screenshots
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update screenshots"
            git push
          fi

  build:
    name: Release build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5

      # Checks the signing secrets before Gradle runs, so a wrong password or alias
      # shows up as a readable error instead of a failed signing task.
      - name: Check signing secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: .github/scripts/check-keystore.sh "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          ./gradlew --console=plain :app:assembleRelease 2>&1 | tee -a gradle.log
          version="${VERSION_NAME:-0.1.0-${GITHUB_RUN_NUMBER}}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PA-Analyzer-${version#v}-arm64.apk"

      - name: Check APK signature and ABI
        run: |
          apk=$(ls dist/*.apk)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if ! "$apksigner" verify --print-certs "$apk" > signature.txt 2>&1; then
            echo "::error::$apk is not correctly signed:"; cat signature.txt; exit 1
          fi
          echo "::notice title=Signed with::$(grep -m1 'certificate DN' signature.txt | cut -d: -f2- | xargs)"
          other=$(unzip -Z1 "$apk" | grep '^lib/' | grep -v '^lib/arm64-v8a/' || true)
          if [ -n "$other" ]; then
            echo "::error::$apk contains native code for other ABIs:"; echo "$other"; exit 1
          fi

      - name: Report Gradle errors
        if: failure()
        run: .github/scripts/report-gradle-errors.sh gradle.log

      - uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.apk --generate-notes
